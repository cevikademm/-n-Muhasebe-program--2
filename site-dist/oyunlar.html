<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Oyunlar · fikoai.de</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/oyunlar-panel/style.css">
  <style>
    /* Giriş */
    .login { min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: radial-gradient(600px 400px at 20% 20%, rgba(124, 92, 255, .18), transparent 70%), radial-gradient(500px 400px at 85% 80%, rgba(46, 230, 255, .12), transparent 70%), var(--bg); }
    .login-box { width: min(400px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 32px; box-shadow: var(--shadow); display: grid; gap: 16px; }
    .login-box h1 { font: 700 22px var(--font-display); margin: 0; }
    .login-box .lock { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: var(--panel-2); border: 1px solid var(--line); font-size: 22px; }
    .login-err { color: var(--red); font-size: 14px; min-height: 20px; margin: 0; }

    /* Panel iskeleti */
    .app { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }
    .app > div { min-width: 0; }
    .side { background: var(--bg-2); border-right: 1px solid var(--line); padding: 20px 14px; display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh; }
    .side .logo { font: 700 15px var(--font-display); display: flex; gap: 10px; align-items: center; padding: 4px 10px 18px; }
    .side .logo .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--pink); box-shadow: 0 0 12px var(--pink); }
    .tab { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 10px; color: var(--muted); font-weight: 700; cursor: pointer; border: 0; background: none; text-align: left; width: 100%; }
    .tab:hover { background: var(--panel); color: var(--text); }
    .tab.active { background: var(--panel-2); color: var(--text); box-shadow: inset 3px 0 0 var(--pink); }
    .tab .cnt { font-size: 12px; background: var(--amber); color: #1a1200; border-radius: 999px; padding: 1px 8px; font-weight: 800; }
    .side .spacer { flex: 1; }
    .side .me { font-size: 12px; color: var(--dim); padding: 8px 12px; word-break: break-all; }

    .main { padding: 24px 28px 60px; min-width: 0; }
    .page-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
    .page-head h2 { font: 700 24px var(--font-display); margin: 0; }
    .page-head .tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 26px; }
    .stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
    .stat .v { font: 700 28px var(--font-display); }
    .stat .l { color: var(--muted); font-size: 13px; font-weight: 600; }
    .stat.warn .v { color: var(--amber); }
    .stat.good .v { color: var(--lime); }
    .stat.bad .v { color: var(--red); }

    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 22px; overflow: hidden; }
    .panel > h3 { margin: 0; padding: 14px 18px; font: 600 15px var(--font-display); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 11px 14px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
    th { color: var(--dim); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; background: var(--bg-2); }
    tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: rgba(255, 255, 255, .02); }
    td .row-actions { display: flex; gap: 6px; }
    .code { font: 700 14px var(--font-mono); color: var(--lime); letter-spacing: .05em; }
    .hash { font: 500 12px var(--font-mono); color: var(--muted); }
    .empty-row { text-align: center; color: var(--dim); padding: 28px; }

    .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }
    .gcard { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; }
    .gcard.off { border-color: rgba(255, 77, 94, .45); }
    .gcard .gcover { aspect-ratio: 16/8; background: #120f1c center/cover; display: grid; place-items: center; font: 800 22px var(--font-display); position: relative; }
    .gcard .gcover .badge { position: absolute; top: 10px; left: 10px; background: rgba(11, 10, 18, .85); font: 700 12px var(--font-body); }
    .gcard .gbody { padding: 16px 18px; display: grid; gap: 12px; flex: 1; }
    .gcard h4 { margin: 0; font: 700 18px var(--font-display); }
    .gcard .gid { font: 500 12px var(--font-mono); color: var(--dim); }
    .gcard .switches { display: grid; gap: 10px; padding: 12px; border-radius: 12px; background: var(--bg-2); border: 1px solid var(--line); }
    .gcard .switches .switch { justify-content: space-between; width: 100%; font-weight: 700; font-size: 14px; }
    .gcard .gfoot { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }
    .mini { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
    .mini b { color: var(--text); }

    .filters { display: flex; gap: 10px; flex-wrap: wrap; padding: 12px 14px; border-bottom: 1px solid var(--line); background: var(--bg-2); }
    .filters .input { width: auto; min-width: 160px; padding: 8px 12px; }

    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .hint { font-size: 12px; color: var(--dim); font-weight: 500; }
    .upload-box { border: 1px dashed var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; }
    .progress { height: 8px; background: var(--bg-2); border-radius: 999px; overflow: hidden; }
    .progress > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--pink), var(--cyan)); transition: width .2s; }
    .divider { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
    .section-label { font: 600 13px var(--font-display); color: var(--cyan); margin: 4px 0 -4px; }

    .panic { border-color: var(--red) !important; color: var(--red) !important; }

    .mobile-tabs { display: none; }
    /* fikoai /app içinde modül olarak açıldığında */
    .embed .side a.tab, .embed #logout, .embed #logout-m, .embed .mobile-tabs a.tab, .embed .login-box > a { display: none !important; }
    .embed .side { height: 100%; }
    @media (max-width: 860px) {
      .app { grid-template-columns: 1fr; }
      .side { display: none; }
      .mobile-tabs { display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--bg-2); position: sticky; top: 0; z-index: 10; }
      .mobile-tabs .tab { width: auto; white-space: nowrap; }
      .main { padding: 18px 16px 60px; }
      .grid2, .grid3 { grid-template-columns: 1fr; }
      /* Lisans kodları: telefonda kart görünümü, butonlar hep görünür */
      .dev-table thead { display: none; }
      .dev-table, .dev-table tbody { display: block; }
      .dev-table tr { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
      .dev-table td { border: 0; padding: 0; white-space: normal; }
      .dev-table td:nth-child(2) { color: var(--muted); font-size: 13px; text-align: right; }
      .dev-table td:nth-child(3) { grid-column: 1 / -1; }
      .dev-table td:nth-child(5) { color: var(--dim); font-size: 13px; text-align: right; }
      .dev-table td.c-act { grid-column: 1 / -1; text-align: left !important; }
      .dev-table td.c-act .row-actions { justify-content: flex-start !important; flex-wrap: wrap; }
      .dev-table td.c-act .btn { min-height: 40px; }
    }
    .person { margin-top: 4px; font-size: 13px; color: var(--text, #e8ecf8); }
    .person b { color: #34d399; }
    .tab .cnt.red { background: #ef4444; color: #fff; }
    .alert-box { border: 1px solid rgba(239, 68, 68, .55); background: linear-gradient(180deg, rgba(239, 68, 68, .16), rgba(239, 68, 68, .06)); border-radius: 14px; padding: 12px 14px; margin-bottom: 16px; }
    .alert-box h3 { margin: 0 0 8px; font-size: 15px; color: #fecaca; display: flex; gap: 8px; align-items: center; }
    .alert-row { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; padding: 9px 0; border-top: 1px solid rgba(239, 68, 68, .2); font-size: 13px; }
    .alert-row:first-of-type { border-top: 0; }
    .alert-row .k { font-weight: 800; color: #fca5a5; white-space: nowrap; }
    .alert-row.warn .k { color: #fbbf24; }
    .alert-row.info .k { color: #93c5fd; }
    .alert-row .d { color: var(--text, #e8ecf8); line-height: 1.45; }
    .alert-row .row-actions { justify-content: flex-end; flex-wrap: wrap; }
    @media (max-width: 760px) { .alert-row { grid-template-columns: 1fr; } .alert-row .row-actions { justify-content: flex-start; } }
    .hw-grid { display: grid; grid-template-columns: 170px 1fr 1fr; gap: 0; font-size: 12.5px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .hw-grid > div { padding: 6px 9px; border-top: 1px solid var(--line); word-break: break-all; }
    .hw-grid > div.h { font-weight: 800; background: rgba(255, 255, 255, .04); border-top: 0; }
    .hw-grid > div.l { color: var(--muted); }
    .hw-grid > div.bad { color: #fca5a5; font-weight: 700; }
    .tt { font-size: 12.5px; margin-top: 3px; }
    .tt.ok { color: #34d399; } .tt.no { color: #fbbf24; }

    /* ===== v2 tasarım: geçişler + lisans kartları (7 Kas 2026) ===== */
    .tab { transition: background .22s ease, color .22s ease, box-shadow .22s ease, transform .15s ease; }
    .tab:active { transform: scale(.97); }
    .mobile-tabs { scroll-behavior: smooth; scrollbar-width: none; }
    .mobile-tabs::-webkit-scrollbar { display: none; }
    .mobile-tabs .tab { border-radius: 999px; padding: 8px 14px; }
    .mobile-tabs .tab.active { background: linear-gradient(100deg, rgba(124,92,255,.28), rgba(76,201,240,.18)); color: #fff; box-shadow: inset 0 0 0 1px rgba(124,92,255,.55); }
    #main.anim > * { animation: viewIn .32s cubic-bezier(.2,.8,.2,1) both; }
    #main.anim > *:nth-child(2) { animation-delay: .04s; } #main.anim > *:nth-child(3) { animation-delay: .08s; } #main.anim > *:nth-child(4) { animation-delay: .12s; }
    #main.anim .dcard { animation: cardIn .38s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 45ms + 80ms); }
    @keyframes viewIn { from { opacity: 0; transform: translateY(10px); } }
    @keyframes cardIn { from { opacity: 0; transform: translateY(14px) scale(.985); } }
    @media (prefers-reduced-motion: reduce) { #main.anim > *, #main.anim .dcard { animation: none; } }

    .dev-toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .dev-toolbar .search { position: relative; flex: 1 1 260px; }
    .dev-toolbar .search span { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--dim); font-size: 17px; pointer-events: none; }
    .dev-toolbar .search .input { padding-left: 36px; border-radius: 12px; }
    .dev-toolbar select.input { flex: 0 1 200px; width: auto; border-radius: 12px; }
    .seg { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 4px; margin-bottom: 16px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 14px; }
    .seg::-webkit-scrollbar { display: none; }
    .seg-btn { flex: 1 0 auto; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 12px; border: 0; border-radius: 10px; background: none; color: var(--muted); font-weight: 700; font-size: 13.5px; cursor: pointer; transition: background .22s, color .22s, box-shadow .22s; white-space: nowrap; }
    .seg-btn i { font-style: normal; font-size: 11.5px; min-width: 20px; padding: 1px 6px; border-radius: 999px; background: rgba(255,255,255,.07); color: var(--muted); }
    .seg-btn.on { background: var(--panel-2); color: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.35), inset 0 0 0 1px var(--line); }
    .seg-btn.on.s-pending i { background: var(--amber); color: #1a1200; }
    .seg-btn.on.s-approved i, .seg-btn.on.s-online i { background: var(--lime); color: #04210f; }
    .seg-btn.on.s-revoked i { background: var(--red); color: #fff; }
    .seg-btn.on.s-all i { background: var(--pink); color: #fff; }

    .dgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; align-items: start; }
    .panel .dgrid { padding: 14px; }
    .dcard { position: relative; display: flex; flex-direction: column; gap: 12px; padding: 16px 16px 14px; border-radius: 18px; overflow: hidden;
      background: linear-gradient(180deg, color-mix(in srgb, var(--acc) 9%, var(--panel)) 0%, var(--panel) 42%); border: 1px solid var(--line);
      box-shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 12px 30px -18px rgba(0,0,0,.8); transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease; }
    .dcard::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: linear-gradient(90deg, var(--acc), transparent 85%); opacity: .9; }
    .dcard:hover { border-color: color-mix(in srgb, var(--acc) 45%, var(--line)); box-shadow: 0 16px 40px -20px color-mix(in srgb, var(--acc) 60%, #000); }
    .dcard.st-pending { border-color: rgba(255,197,107,.55); box-shadow: 0 0 0 1px rgba(255,197,107,.18), 0 14px 34px -20px rgba(255,197,107,.55); }
    .dcard.st-revoked, .dcard.st-expired { opacity: .72; }
    .dcard.st-revoked .dc-code { color: var(--dim); text-decoration: line-through; text-decoration-color: rgba(255,107,125,.6); }
    .dc-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .dc-game { display: inline-flex; align-items: center; gap: 8px; font: 600 13px var(--font-display); color: var(--text); letter-spacing: .01em; }
    .dc-game i { width: 9px; height: 9px; border-radius: 3px; background: var(--acc); box-shadow: 0 0 10px var(--acc); }
    .dc-state { display: inline-flex; align-items: center; gap: 8px; }
    .pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 0 rgba(126,226,168,.7); animation: pulse 1.8s infinite; }
    @keyframes pulse { 70% { box-shadow: 0 0 0 9px rgba(126,226,168,0); } 100% { box-shadow: 0 0 0 0 rgba(126,226,168,0); } }
    .dc-code { align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; padding: 0; border: 0; background: none; cursor: pointer;
      font: 700 22px var(--font-mono); letter-spacing: .06em; color: var(--lime); transition: opacity .15s; }
    .dc-code span { font-size: 15px; color: var(--dim); transition: color .15s; }
    .dc-code:hover span { color: var(--cyan); }
    .dc-code:active { opacity: .6; }
    .dc-who { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,.035); border: 1px solid var(--line); }
    .dc-who .av { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font: 700 15px var(--font-display); color: #fff;
      background: linear-gradient(135deg, var(--acc), color-mix(in srgb, var(--acc) 30%, #1b2140)); }
    .dc-who .who-t { min-width: 0; flex: 1; display: grid; }
    .dc-who .who-t b { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dc-who .who-t span { font: 500 12px var(--font-mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dc-who .wa { flex: none; text-decoration: none; font-size: 12.5px; font-weight: 700; padding: 7px 11px; border-radius: 999px; color: #25d366; border: 1px solid rgba(37,211,102,.45); background: rgba(37,211,102,.08); }
    .dc-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--muted);
      background: rgba(255,255,255,.04); border: 1px solid var(--line); text-decoration: none; white-space: nowrap; }
    .chip.ok { color: var(--lime); border-color: rgba(126,226,168,.35); background: rgba(126,226,168,.07); }
    .chip.warn { color: var(--amber); border-color: rgba(255,197,107,.35); background: rgba(255,197,107,.07); }
    .chip.bad { color: var(--red); border-color: rgba(255,107,125,.4); background: rgba(255,107,125,.08); }
    .chip.info { color: #93c5fd; border-color: rgba(147,197,253,.35); }
    .chip.tt { color: var(--text); }
    .dc-more { border-top: 1px dashed var(--line); padding-top: 8px; }
    .dc-more summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--muted); padding: 2px 0; }
    .dc-more summary::-webkit-details-marker { display: none; }
    .dc-more summary::before { content: "›"; display: inline-block; margin-right: 6px; transition: transform .2s; font-size: 16px; }
    .dc-more[open] summary::before { transform: rotate(90deg); }
    .dc-more summary .when { margin-left: auto; font-weight: 500; color: var(--dim); font-size: 12.5px; }
    .dc-more dl { display: grid; grid-template-columns: 112px 1fr; gap: 7px 12px; margin: 10px 0 2px; font-size: 13px; animation: viewIn .25s ease both; }
    .dc-more dt { color: var(--dim); font-weight: 600; }
    .dc-more dd { margin: 0; min-width: 0; word-break: break-word; }
    .dc-more dd a { color: var(--cyan); }
    .dc-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
    .dc-actions .btn { min-height: 42px; padding: 9px 16px; font-size: 14px; }
    .dc-actions .grow { flex: 1 1 120px; }
    .dc-actions .btn.ok.solid { background: linear-gradient(100deg, #34d399, #7ee2a8); color: #04210f; border-color: transparent; box-shadow: 0 8px 22px -10px rgba(52,211,153,.7); }
    .dc-actions .sq { flex: 0 0 auto; gap: 6px; }
    .dc-actions .sq span { font-size: 13px; }
    .empty-card { display: grid; place-items: center; gap: 6px; text-align: center; padding: 38px 18px; border: 1px dashed var(--line); border-radius: 18px; color: var(--muted); }
    .empty-card .ico { font-size: 30px; color: var(--dim); }
    .empty-card b { color: var(--text); }
    @media (max-width: 860px) {
      .dgrid { grid-template-columns: 1fr; }
      .panel .dgrid { padding: 12px; }
      .dev-toolbar select.input { flex: 1 1 100%; }
      .page-head { margin-bottom: 14px; }
      .page-head h2 { font-size: 22px; }
      .dc-code { font-size: 20px; }
      .seg-btn { flex: 0 0 auto; padding: 8px 10px; }
    }
    @media (max-width: 420px) { .dc-actions .sq span { display: none; } .dc-actions .sq { min-width: 46px; } }
  </style>
</head>
<body>
  <!-- Giriş ekranı -->
  <div class="login" id="login-view">
    <form class="login-box" id="login-form" autocomplete="on">
      <div class="lock" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="3"/><path d="M6 12h4M8 10v4M15 11h.01M18 13h.01"/></svg></div>
      <h1>fikoai · Oyunlar</h1>
      <p class="muted" style="margin:-6px 0 4px;font-size:14px">Oyun lisans kodları ve uzaktan kapatma. fikoai hesabınla giriş yap — yalnızca yöneticiye açıktır.</p>
      <label class="field">E-posta<input class="input" type="email" id="email" required autocomplete="username"></label>
      <label class="field">Şifre<input class="input" type="password" id="password" required autocomplete="current-password"></label>
      <p class="login-err" id="login-err"></p>
      <button class="btn primary" type="submit" id="login-btn">Giriş yap</button>
      <a href="/" class="muted" style="font-size:13px;text-align:center">← fikoai.de</a>
    </form>
  </div>

  <!-- Panel -->
  <div class="app hidden" id="app-view">
    <aside class="side">
      <div class="logo"><span class="dot"></span>fikoai · Oyunlar</div>
      <button class="tab active" data-tab="devices">Lisans kodları <span class="cnt hidden" data-cnt="pending"></span></button>
      <button class="tab" data-tab="alerts">Güvenlik uyarıları <span class="cnt red hidden" data-cnt="alerts"></span></button>
      <button class="tab" data-tab="downloads">İndirmeler</button>
      <button class="tab" data-tab="games">Oyunlar</button>
      <button class="tab" data-tab="overview">Genel bakış</button>
      <button class="tab" data-tab="builds">Build'ler <span class="cnt hidden" data-cnt="builds_pending"></span></button>
      <button class="tab" data-tab="log">Kayıtlar</button>
      <div class="spacer"></div>
      <a class="tab" href="/#spiele" target="_blank" rel="noopener">Sitede gör ↗</a>
      <a class="tab" href="/app">fikoai uygulaması ↗</a>
      <div class="me" id="me"></div>
      <button class="btn sm ghost" id="logout">Çıkış yap</button>
    </aside>
